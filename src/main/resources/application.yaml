spring:
  application:
    name: ms-articulos
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${ARTICULOS_DB_URL:jdbc:postgresql://localhost:5432/bodega_articulos}
    username: ${ARTICULOS_DB_USERNAME}
    password: ${ARTICULOS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

gateway:
  # Secreto que agrega el API Gateway en el header X-Gateway-Secret. Vacío = no se exige (local y tests).
  secret: ${GATEWAY_SECRET:}

sqs:
  # URL de la cola de eventos de artículos. Vacía = no se publica (desarrollo local y tests).
  cola-url: ${SQS_COLA_URL:}
  region: ${AWS_REGION:us-east-1}

server:
  address: ${ARTICULOS_ADDRESS:127.0.0.1}
  port: ${ARTICULOS_PORT:8082}
